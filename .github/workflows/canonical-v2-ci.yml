name: Canonical v2 validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Parse canonical PowerShell scripts
        shell: pwsh
        run: ./tools/test-canonical-script-syntax.ps1
      - name: Canonical quality fixtures
        shell: pwsh
        run: ./tools/test-canonical-quality.ps1
      - name: Data quality v2 contract
        shell: pwsh
        run: ./tools/test-data-quality-v2.ps1
      - name: Published schema mirrors canonical schema
        shell: pwsh
        run: |
          $canonical = (Get-Content -Raw -Encoding UTF8 schema/data-quality.schema.json).Replace("`r`n","`n")
          $published = (Get-Content -Raw -Encoding UTF8 site/schema/data-quality.schema.json).Replace("`r`n","`n")
          if ($canonical -ne $published) { throw 'Published data-quality schema drifted from canonical schema.' }
      - name: Typed display value resolver
        shell: pwsh
        run: ./tools/test-display-value-resolver.ps1
      - name: Current-set item universe
        shell: pwsh
        run: ./tools/test-current-set-universe.ps1
      - name: Cross-set golden regressions
        shell: pwsh
        run: ./tools/test-golden-set-regressions.ps1
      - name: Current-set catalog integration
        shell: pwsh
        run: ./tools/test-current-set-catalog-integration.ps1
      - name: Strict Platinum+ rank scope
        shell: pwsh
        run: ./tools/test-rank-scope-policy.ps1
      - name: Strict production MetaTFT source policy
        shell: pwsh
        run: ./tools/test-strict-production-source-policy.ps1
      - name: Candidate publication lifecycle
        shell: pwsh
        run: ./tools/test-candidate-publication-lifecycle.ps1
      - name: Live current-set catalog universe
        shell: pwsh
        run: ./tools/audit-live-current-set-universe.ps1
      - name: Measure live emblem quality
        shell: pwsh
        run: ./tools/measure-emblem-quality.ps1 -RequireReady
      - name: Trait-to-emblem mapping
        shell: pwsh
        run: ./tools/test-emblem-mapping.ps1
      - name: Platinum+ MetaTFT composition adapter
        shell: pwsh
        run: ./tools/test-metatft-adapter.ps1
      - name: MetaTFT level board adapter
        shell: pwsh
        run: ./tools/test-metatft-boards.ps1
      - name: MetaTFT item semantics
        shell: pwsh
        run: ./tools/test-metatft-items.ps1
      - name: Existing cross-source ID policy
        shell: pwsh
        run: ./tools/test-id-compatibility-policy.ps1
      - name: Existing new-set readiness regression
        shell: pwsh
        run: ./tools/test-new-set-readiness.ps1
      - name: Existing patch detection regression
        shell: pwsh
        run: ./tools/test-patch-detection-policy.ps1
      - name: Existing data history regression
        shell: pwsh
        run: ./tools/test-data-history-policy.ps1
      - name: Build live Canonical v2 dry-run
        shell: pwsh
        run: ./tools/metatft/build-live-canonical-dryrun.ps1
      - name: Validate live Canonical v2 dry-run
        shell: pwsh
        run: ./tools/metatft/validate-live-canonical-dryrun.ps1
      - name: Capture immutable live source snapshots
        shell: pwsh
        run: ./tools/metatft/capture-live-source-snapshots.ps1
      - name: Preserve live Canonical v2 dry-run and sources
        if: always() && hashFiles('build/canonical-v2-live/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: canonical-v2-live-${{ github.run_id }}
          path: build/canonical-v2-live
          if-no-files-found: error
          retention-days: 14
      - name: Audit live MetaTFT source shapes
        shell: pwsh
        run: ./tools/metatft/audit-live-source-shapes.ps1
      - name: Preserve source-shape audit
        if: always() && hashFiles('build/metatft-source-audit/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: metatft-source-shapes-${{ github.run_id }}
          path: build/metatft-source-audit
          if-no-files-found: error
          retention-days: 14
