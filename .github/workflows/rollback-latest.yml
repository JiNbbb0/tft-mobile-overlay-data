name: Restore a validated version as latest

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Existing version ID to restore
        required: true
        type: string

concurrency:
  group: tft-data-publication
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  DATA_INDEX_URL: https://jinbbb0.github.io/tft-mobile-overlay-data/data-index.json

jobs:
  restore:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Validate target and change latest atomically
        shell: pwsh
        run: ./tools/set-latest-version.ps1 -VersionId '${{ inputs.version_id }}'
      - name: Commit only index and health pointer changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data-index.json site/health.json
          git commit -m "recovery: restore latest to ${{ inputs.version_id }}"
          $pushed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not $pushed) {
            git fetch origin main
            git merge-base --is-ancestor origin/main HEAD
            if ($LASTEXITCODE -ne 0) {
              throw "Remote main advanced; rerun rollback against the current validated history."
            }
            throw "Rollback push failed after 3 bounded attempts."
          }
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload validated site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify restored public latest
        shell: pwsh
        run: |
          ./tools/validate-remote-site.ps1 -DataIndexUrl $env:DATA_INDEX_URL
          ./tools/reconcile-publication.ps1 -DataIndexUrl $env:DATA_INDEX_URL -FailWhenOutOfSync
      - name: Write recovery summary
        shell: pwsh
        run: |
          @"
          ## Latest recovery

          - Result: PASS
          - Restored version: ${{ inputs.version_id }}
          - Data index: $env:DATA_INDEX_URL
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
