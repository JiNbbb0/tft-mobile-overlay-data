name: Refresh and publish TFT data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/**"
      - "schema/**"
      - ".github/workflows/refresh-tft-data.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: tft-data-publication
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  DATA_INDEX_URL: https://jinbbb0.github.io/tft-mobile-overlay-data/data-index.json

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 50
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
      publish_required: ${{ steps.reconcile.outputs.publish_required }}
      detected_version: ${{ steps.refresh.outputs.detected_version }}
    steps:
      - name: Check out data repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Enforce runtime compatibility contracts
        shell: pwsh
        run: ./tools/ensure-json-array-contract.ps1

      - name: Enable canonical current-set catalog universe
        shell: pwsh
        run: ./tools/enable-current-set-catalog-universe.ps1

      - name: Verify runtime hardening postconditions
        shell: pwsh
        run: ./tools/verify-runtime-hardening.ps1

      - name: Test current-set catalog universe
        shell: pwsh
        run: |
          ./tools/test-current-set-universe.ps1
          ./tools/test-current-set-catalog-integration.ps1

      - name: Test cross-source ID compatibility policy
        shell: pwsh
        run: ./tools/test-id-compatibility-policy.ps1

      - name: Test bounded new-set rank fallback policy
        shell: pwsh
        run: ./tools/test-rank-scope-policy.ps1

      - name: Test resilient official patch detection policy
        shell: pwsh
        run: ./tools/test-patch-detection-policy.ps1

      - name: Test append-only data history policy
        shell: pwsh
        run: ./tools/test-data-history-policy.ps1

      - name: Test unattended publication reconciliation policy
        shell: pwsh
        run: ./tools/test-publication-state.ps1

      - name: Test new-set catalog-first readiness and rollback
        shell: pwsh
        run: ./tools/test-new-set-readiness.ps1

      - name: Detect, generate, validate, and stage a new version
        id: refresh
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "build/force-json-contract-repair.flag") {
            ./tools/refresh-live-data-gated.ps1 -Force
          } else {
            ./tools/refresh-live-data-gated.ps1
          }

      - name: Validate generated cross-source compatibility
        id: compatibility
        if: success()
        shell: pwsh
        run: ./tools/validate-data-compatibility.ps1

      - name: Write user-visible data quality status
        if: success()
        shell: pwsh
        run: ./tools/write-data-quality-status.ps1

      - name: Validate complete site
        if: success()
        shell: pwsh
        run: ./tools/validate-site.ps1

      - name: Commit validated history only when changed
        if: success() && steps.refresh.outputs.changed == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/current site
          if (-not (git status --porcelain)) {
            throw "Refresh reported a change but produced no tracked diff"
          }
          git commit -m "data: publish ${{ steps.refresh.outputs.detected_version }}"
          $pushed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              $pushed = $true
              break
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not $pushed) {
            git fetch origin main
            git merge-base --is-ancestor origin/main HEAD
            if ($LASTEXITCODE -ne 0) {
              throw "Remote main advanced during publication; the next scheduled run will regenerate from that commit."
            }
            throw "Push failed after 3 bounded attempts; the next scheduled run will retry."
          }

      - name: Reconcile tracked latest with public Pages
        id: reconcile
        if: success()
        shell: pwsh
        run: ./tools/reconcile-publication.ps1 -DataIndexUrl $env:DATA_INDEX_URL

      - name: Configure Pages
        if: success() && steps.reconcile.outputs.publish_required == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: success() && steps.reconcile.outputs.publish_required == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Preserve concise failure report
        if: failure() && hashFiles('build/failure-report/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: refresh-failure-${{ github.run_id }}
          path: build/failure-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Write Actions summary
        if: always()
        shell: pwsh
        run: |
          $result = '${{ steps.refresh.outputs.result }}'
          if (-not $result) { $result = '${{ job.status }}' }
          @"
          ## TFT data refresh

          - Result: $result
          - Detected version: ${{ steps.refresh.outputs.detected_version }}
          - Set: ${{ steps.refresh.outputs.detected_set }}
          - Patch: ${{ steps.refresh.outputs.detected_patch }}
          - Revision: ${{ steps.refresh.outputs.detected_revision }}
          - Update kind: ${{ steps.refresh.outputs.detected_kind }}
          - Changed: ${{ steps.refresh.outputs.changed }}
          - Publication required: ${{ steps.reconcile.outputs.publish_required }}
          - Public state before deployment: ${{ steps.reconcile.outputs.public_state }}
          - Published artifact prepared: ${{ steps.refresh.outputs.published }}
          - Data quality: ${{ steps.compatibility.outputs.quality_state }}
          - Composition coverage: ${{ steps.compatibility.outputs.composition_count }}/${{ steps.compatibility.outputs.target_composition_count }}
          - Qualified source compositions: ${{ steps.compatibility.outputs.qualified_source_compositions }}
          - Compositions missing optional augment recommendations: ${{ steps.compatibility.outputs.missing_augment_compositions }}
          - Data warnings: ${{ steps.compatibility.outputs.warning_codes }}
          - No change means: sources were checked and no semantic catalog/meta change was published.
          - Validation/job status: ${{ job.status }}
          - Pages URL: https://jinbbb0.github.io/tft-mobile-overlay-data/
          - Data index: $env:DATA_INDEX_URL
          - Data quality: https://jinbbb0.github.io/tft-mobile-overlay-data/data-quality.json
          - Failed stage: ${{ steps.refresh.outputs.failed_stage }}
          - Next action: Inspect the failure artifact only when this run failed.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

  deploy:
    if: needs.refresh.result == 'success' && needs.refresh.outputs.publish_required == 'true'
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact atomically
        id: deployment
        uses: actions/deploy-pages@v5

  verify-publication:
    if: needs.deploy.result == 'success'
    needs: [refresh, deploy]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify HTTPS index, manifest, JSON, sample blob, and quality status
        shell: pwsh
        run: |
          $verified = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              ./tools/validate-remote-site.ps1 -DataIndexUrl $env:DATA_INDEX_URL
              ./tools/reconcile-publication.ps1 -DataIndexUrl $env:DATA_INDEX_URL -FailWhenOutOfSync
              ./tools/check-public-data-quality.ps1 -DataIndexUrl $env:DATA_INDEX_URL
              $verified = $true
              break
            } catch {
              if ($attempt -eq 6) { throw }
              Write-Warning "Public verification attempt $attempt failed while Pages propagates."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          if (-not $verified) { throw "Public Pages validation did not converge."
          }
      - name: Record public verification
        shell: pwsh
        run: |
          "- Public E2E validation: PASS" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          "- Data index: $env:DATA_INDEX_URL" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          "- Data quality: https://jinbbb0.github.io/tft-mobile-overlay-data/data-quality.json" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
