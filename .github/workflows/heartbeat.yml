name: Keep scheduled automation active

on:
  workflow_dispatch:
  schedule:
    - cron: "13 17 1 * *"

concurrency:
  group: tft-data-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Update one small state file
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force state | Out-Null
          $state = [ordered]@{
            schemaVersion = 1
            updatedAtUtc = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            purpose = 'Keep public-repository scheduled workflows active without changing released data.'
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'state/heartbeat.json'), ($state | ConvertTo-Json) + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/heartbeat.json
          git commit -m "chore: monthly automation heartbeat"
          $pushed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not $pushed) {
            git fetch origin main
            git merge-base --is-ancestor origin/main HEAD
            if ($LASTEXITCODE -ne 0) {
              throw "Remote main advanced; a later heartbeat or data refresh will safely retry."
            }
            throw "Heartbeat push failed after 3 bounded attempts."
          }
      - name: Write summary
        shell: pwsh
        run: "'- Result: monthly heartbeat committed; release data unchanged' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8"
