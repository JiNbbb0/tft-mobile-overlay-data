name: Canonical v2 validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Canonical quality fixtures
        shell: pwsh
        run: ./tools/test-canonical-quality.ps1
      - name: Typed display value resolver
        shell: pwsh
        run: ./tools/test-display-value-resolver.ps1
      - name: Current-set item universe
        shell: pwsh
        run: ./tools/test-current-set-universe.ps1
      - name: Trait-to-emblem mapping
        shell: pwsh
        run: ./tools/test-emblem-mapping.ps1
      - name: Platinum+ MetaTFT composition adapter
        shell: pwsh
        run: ./tools/test-metatft-adapter.ps1
      - name: MetaTFT level board adapter
        shell: pwsh
        run: ./tools/test-metatft-boards.ps1
      - name: MetaTFT item semantics
        shell: pwsh
        run: ./tools/test-metatft-items.ps1
      - name: Existing cross-source ID policy
        shell: pwsh
        run: ./tools/test-id-compatibility-policy.ps1
      - name: Existing new-set readiness regression
        shell: pwsh
        run: ./tools/test-new-set-readiness.ps1
      - name: Existing patch detection regression
        shell: pwsh
        run: ./tools/test-patch-detection-policy.ps1
      - name: Existing data history regression
        shell: pwsh
        run: ./tools/test-data-history-policy.ps1
      - name: Audit live MetaTFT source shapes
        shell: pwsh
        run: ./tools/metatft/audit-live-source-shapes.ps1
      - name: Preserve source-shape audit
        if: always() && hashFiles('build/metatft-source-audit/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: metatft-source-shapes-${{ github.run_id }}
          path: build/metatft-source-audit
          if-no-files-found: error
          retention-days: 14
