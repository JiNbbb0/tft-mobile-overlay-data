name: Watch unattended data automation

on:
  workflow_dispatch:
  schedule:
    - cron: "13,33,53 * * * *"
  workflow_run:
    workflows: ["Refresh and publish TFT data"]
    types: [completed]

concurrency:
  # Inspection must not replace a pending 15-minute refresh. Only the repair
  # deployment below joins the publication lock.
  group: tft-data-watchdog
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  issues: write
  pages: write
  id-token: write

env:
  DATA_INDEX_URL: https://jinbbb0.github.io/tft-mobile-overlay-data/data-index.json

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      publish_required: ${{ steps.reconcile.outputs.publish_required }}
      quality_requires_attention: ${{ steps.quality.outputs.requires_attention }}
      quality_reason: ${{ steps.quality.outputs.reason }}
      quality_state: ${{ steps.quality.outputs.quality_state }}
      freshness_needs_refresh: ${{ steps.freshness.outputs.needs_refresh }}
      freshness_reason: ${{ steps.freshness.outputs.reason }}
      freshness_age_minutes: ${{ steps.freshness.outputs.age_minutes }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Test watchdog and publication reconciliation policy
        shell: pwsh
        run: |
          ./tools/test-publication-state.ps1
          ./tools/test-autonomous-recovery.ps1
          ./tools/test-watchdog-runtime.ps1

      - name: Compare tracked publication with public Pages
        id: reconcile
        shell: pwsh
        run: |
          $checkUrl = "${env:DATA_INDEX_URL}?watchdog=${{ github.run_id }}-inspect"
          ./tools/reconcile-publication.ps1 -DataIndexUrl $checkUrl

      - name: Check public user-visible data quality
        id: quality
        shell: pwsh
        run: |
          $checkUrl = "${env:DATA_INDEX_URL}?watchdog=${{ github.run_id }}-quality"
          ./tools/check-public-data-quality.ps1 -DataIndexUrl $checkUrl

      - name: Check public source freshness
        id: freshness
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $checkUrl = "${env:DATA_INDEX_URL}?watchdog=${{ github.run_id }}-freshness"
          ./.github/scripts/check-refresh-freshness.ps1 -DataIndexUrl $checkUrl -MaxSourceAgeMinutes 45 -Repository '${{ github.repository }}'

      - name: Queue self-healing refresh when source data is stale
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.freshness.outputs.needs_refresh == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./.github/scripts/request-refresh-recovery.ps1 -Repository '${{ github.repository }}'

  repair-publication:
    if: needs.inspect.result == 'success' && needs.inspect.outputs.publish_required == 'true'
    needs: inspect
    runs-on: windows-latest
    timeout-minutes: 25
    concurrency:
      group: tft-data-publication
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Acquire the publication lock BEFORE checkout/validation/artifact creation.
      # Otherwise an artifact made by inspect may roll back a newer refresh.
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Reconcile again under the publication lock
        id: locked-reconcile
        shell: pwsh
        run: ./tools/reconcile-publication.ps1 -DataIndexUrl $env:DATA_INDEX_URL
      - name: Validate current last-known-good site
        if: steps.locked-reconcile.outputs.publish_required == 'true'
        shell: pwsh
        run: ./tools/validate-site.ps1
      - uses: actions/configure-pages@v6
        if: steps.locked-reconcile.outputs.publish_required == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.locked-reconcile.outputs.publish_required == 'true'
        with:
          path: site
      - name: Atomically redeploy tracked last-known-good site
        id: deployment
        if: steps.locked-reconcile.outputs.publish_required == 'true'
        uses: actions/deploy-pages@v5

  verify-repair:
    if: always() && needs.inspect.result == 'success' && (needs.inspect.outputs.publish_required != 'true' || needs.repair-publication.result == 'success')
    needs: [inspect, repair-publication]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify public index, manifest, data, sample image, and quality status
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              $checkUrl = "${env:DATA_INDEX_URL}?watchdog=${{ github.run_id }}-$attempt"
              ./tools/validate-remote-site.ps1 -DataIndexUrl $checkUrl
              ./tools/reconcile-publication.ps1 -DataIndexUrl $checkUrl -FailWhenOutOfSync
              ./tools/check-public-data-quality.ps1 -DataIndexUrl $checkUrl
              exit 0
            } catch {
              if ($attempt -eq 6) { throw }
              Start-Sleep -Seconds (10 * $attempt)
            }
          }

  report-health:
    if: always()
    needs: [inspect, repair-publication, verify-repair]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Recheck final public state after any repair attempt
        id: final-reconcile
        if: needs.inspect.result == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $checkUrl = "${env:DATA_INDEX_URL}?watchdog=${{ github.run_id }}-final"
          ./tools/reconcile-publication.ps1 -DataIndexUrl $checkUrl

      - name: Recheck final public data quality
        id: final-quality
        if: needs.inspect.result == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $checkUrl = "${env:DATA_INDEX_URL}?watchdog=${{ github.run_id }}-final-quality"
          ./tools/check-public-data-quality.ps1 -DataIndexUrl $checkUrl

      - name: Recheck verification freshness after any repair
        id: final-freshness
        if: needs.inspect.result == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/check-refresh-freshness.ps1 -DataIndexUrl $env:DATA_INDEX_URL -Repository '${{ github.repository }}'

      - name: Upsert or close one sanitized automation health issue
        shell: pwsh
        env:
          GH_AUTOMATION_TOKEN: ${{ github.token }}
          PUBLIC_OUT_OF_SYNC: ${{ needs.inspect.result != 'success' || needs.verify-repair.result != 'success' || steps.final-reconcile.outcome != 'success' || steps.final-reconcile.outputs.publish_required == 'true' }}
          DATA_QUALITY_REQUIRES_ATTENTION: ${{ needs.inspect.result != 'success' || steps.final-quality.outcome != 'success' || steps.final-quality.outputs.requires_attention == 'true' }}
          DATA_QUALITY_REASON: ${{ steps.final-quality.outputs.reason }}
          SOURCE_CHECK_REASON: ${{ steps.final-freshness.outputs.reason }}
          SOURCE_AGE_MINUTES: ${{ steps.final-freshness.outputs.age_minutes }}
        run: |
          $outOfSync = $env:PUBLIC_OUT_OF_SYNC -eq 'true'
          $qualityAttention = $env:DATA_QUALITY_REQUIRES_ATTENTION -eq 'true'
          $qualityReason = if ($env:DATA_QUALITY_REASON) { $env:DATA_QUALITY_REASON } else { 'CHECK_FAILED' }
          $sourceAge = -1.0
          $sourceAgeValid = [double]::TryParse($env:SOURCE_AGE_MINUTES, [Globalization.NumberStyles]::Float, [Globalization.CultureInfo]::InvariantCulture, [ref]$sourceAge)
          $sourceFailed = -not $sourceAgeValid -or $env:SOURCE_CHECK_REASON -notin @('FRESH', 'SOURCE_STALE')
          ./tools/watch-automation-health.ps1 `
            -Repository '${{ github.repository }}' `
            -GitHubToken $env:GH_AUTOMATION_TOKEN `
            -PublicOutOfSync $outOfSync `
            -DataQualityRequiresAttention $qualityAttention `
            -DataQualityReason $qualityReason `
            -SourceAgeMinutes $sourceAge `
            -SourceCheckFailed $sourceFailed
