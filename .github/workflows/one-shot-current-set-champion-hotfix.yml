name: One-shot current-set champion hotfix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-current-set-champion-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Patch namespace-safe current-set champion selection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          function Write-Utf8NoBom([string]$Path, [string]$Text) {
            [IO.File]::WriteAllText($Path, $Text, [Text.UTF8Encoding]::new($false))
          }
          function Replace-ExactlyOnce([string]$Text, [string]$Pattern, [string]$Replacement, [string]$Context) {
            $matches = [regex]::Matches($Text, $Pattern, [Text.RegularExpressions.RegexOptions]::Multiline)
            if ($matches.Count -ne 1) { throw "$Context expected exactly one match, found $($matches.Count)." }
            return [regex]::Replace($Text, $Pattern, [Text.RegularExpressions.MatchEvaluator]{ param($m) $Replacement }, [Text.RegularExpressions.RegexOptions]::Multiline)
          }

          $catalogPath = 'tools/refresh-catalog.ps1'
          $catalog = [IO.File]::ReadAllText($catalogPath).Replace("`r`n", "`n")
          $newSelection = @'
          $playableChampions = @(
              $setJa.champions |
                  Where-Object {
                      $apiName = [string](Get-PropertyValue -Object $_ -Name 'apiName')
                      $cost = Get-PropertyValue -Object $_ -Name 'cost'
                      $name = Get-PropertyValue -Object $_ -Name 'name'
                      $championTraits = Get-PropertyValue -Object $_ -Name 'traits'
                      $apiName -and
                      $null -ne $cost -and [int]$cost -ge 1 -and [int]$cost -le 5 -and
                      $name -and @($championTraits).Count -gt 0
                  } |
                  Sort-Object cost, name
          )
          '@.Trim()
          if (-not $catalog.Contains("Get-PropertyValue -Object `$_ -Name 'apiName'")) {
            $selectionPattern = '(?ms)^\$playableChampions\s*=\s*@\(\s*\$setJa\.champions\s*\|\s*Where-Object\s*\{.*?\}\s*\|\s*Sort-Object\s+cost,\s*name\s*\)'
            $catalog = Replace-ExactlyOnce $catalog $selectionPattern $newSelection 'playable champion selection'
          }

          $safeTraitNames = '$traitNames = @($playableChampions | ForEach-Object { @(Get-PropertyValue -Object $_ -Name ''traits'') } | Where-Object { $_ } | Sort-Object -Unique)'
          if (-not $catalog.Contains($safeTraitNames)) {
            $traitPattern = '(?m)^\$traitNames\s*=\s*@\([^\r\n]*\$playableChampions\.traits[^\r\n]*\)$'
            $catalog = Replace-ExactlyOnce $catalog $traitPattern $safeTraitNames 'champion trait flattening'
          }

          if (-not $catalog.Contains('$expectedChampionIds = @{}')) {
            $newOutOfSet = @'
          $expectedChampionIds = @{}
          foreach ($expectedChampion in $playableChampions) { $expectedChampionIds[[string]$expectedChampion.apiName] = $true }
          $outOfSetChampions = @($champions | Where-Object { -not $expectedChampionIds.ContainsKey([string]$_.id) })
          '@.Trim()
            $outOfSetPattern = '(?m)^\$outOfSetChampions\s*=\s*@\(\$champions\s*\|\s*Where-Object\s*\{[^\r\n]*-notmatch[^\r\n]*\}\)$'
            $catalog = Replace-ExactlyOnce $catalog $outOfSetPattern $newOutOfSet 'out-of-set champion validation'
          }
          Write-Utf8NoBom $catalogPath $catalog

          $gatedPath = 'tools/refresh-live-data-gated.ps1'
          $gated = [IO.File]::ReadAllText($gatedPath).Replace("`r`n", "`n")
          $safeTargetLine = '$newTraitNames = ''$traitNames = @($playableChampions | ForEach-Object { @(Get-PropertyValue -Object $_ -Name ''''traits'''') } | Where-Object { $_ } | Sort-Object -Unique)'''
          if (-not $gated.Contains($safeTargetLine)) {
            $targetPattern = '(?m)^\s*\$newTraitNames\s*=\s*''\$traitNames = @\(\$playableChampions \| ForEach-Object \{ @\(\$_\.traits\) \} \| Where-Object \{ \$_ \} \| Sort-Object -Unique\)''\s*$'
            $gated = Replace-ExactlyOnce $gated $targetPattern ('    ' + $safeTargetLine) 'raw-fallback safe trait target'
          }

          if (-not $gated.Contains('if ($catalogText.Contains($newTraitNames))')) {
            $fallbackPattern = '(?ms)^\s*if \(-not \$catalogText\.Contains\(\$oldTraitNames\)\) \{ throw ''Could not patch champion trait flattening\.'' \}\s*\n\s*\$catalogText = \$catalogText\.Replace\(\$oldTraitNames, \$newTraitNames\)'
            $replacement = @'
              if ($catalogText.Contains($newTraitNames)) {
                  # Source is already namespace-safe; no replacement required.
              } elseif ($catalogText.Contains($oldTraitNames)) {
                  $catalogText = $catalogText.Replace($oldTraitNames, $newTraitNames)
              } else {
                  throw 'Could not patch or verify champion trait flattening.'
              }
          '@.TrimEnd()
            $gated = Replace-ExactlyOnce $gated $fallbackPattern $replacement 'raw-fallback trait compatibility'
          }
          Write-Utf8NoBom $gatedPath $gated

          $workflowPath = '.github/workflows/refresh-tft-data.yml'
          $workflow = [IO.File]::ReadAllText($workflowPath).Replace("`r`n", "`n")
          if (-not $workflow.Contains('Test current-set champion membership policy')) {
            $step = @'
                - name: Test current-set champion membership policy
                  shell: pwsh
                  run: ./tools/test-current-set-champion-membership.ps1

          '@
            $anchor = '      - name: Test cross-source ID compatibility policy'
            $index = $workflow.IndexOf($anchor, [StringComparison]::Ordinal)
            if ($index -lt 0) { throw 'Could not locate refresh workflow test insertion point.' }
            $workflow = $workflow.Insert($index, $step)
          }
          Write-Utf8NoBom $workflowPath $workflow

      - name: Run regression before commit
        shell: pwsh
        run: ./tools/test-current-set-champion-membership.ps1

      - name: Commit source hotfix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/refresh-catalog.ps1 tools/refresh-live-data-gated.ps1 .github/workflows/refresh-tft-data.yml
          if (git diff --cached --quiet) {
            Write-Output 'Hotfix already applied.'
            exit 0
          }
          git commit -m "fix: make current-set champion selection namespace-safe"
          git push origin HEAD:main
