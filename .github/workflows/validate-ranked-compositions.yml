name: Validate ranked compositions

on:
  pull_request:
    paths:
      - "tools/**"
      - "schema/**"
      - "config/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "tools/**"
      - "schema/**"
      - "config/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rank-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-source-access:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Diagnose independent public reference access
        shell: pwsh
        run: ./tools/check-reference-source-access.ps1
  validate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem tools,.github/scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $failures += @($parseErrors)
          }
          if ($failures.Count) { throw ($failures | Out-String) }
      - name: Run complete generator and publication contract regression
        shell: pwsh
        run: ./tools/test-refresh-contracts.ps1
      - name: Run isolated production acquisition, publication, and LKG checks
        shell: pwsh
        run: ./tools/test-ranked-production-refresh.ps1 -RequireReferenceFacts
      - name: Confirm no production content was modified
        shell: pwsh
        run: |
          git diff --exit-code -- source/current site
          if ($LASTEXITCODE -ne 0) { throw 'Dry-run modified tracked production data' }
      - name: Record validation boundary
        if: always()
        shell: pwsh
        run: |
          @"
          ## Ranked composition validation
          - Result: ${{ job.status }}
          - Scope: generated rank data, local publisher, SHA/reference checks, invalid-child LKG protection.
          - Production publication: NOT PERFORMED (read-only job permissions).
          - Android device E2E: NOT PERFORMED.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
