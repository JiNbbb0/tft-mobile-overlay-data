name: Refresh and stage TFT data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/**"
      - "schema/**"
      - ".github/workflows/refresh-tft-data.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: tft-data-publication
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  DATA_INDEX_URL: https://jinbbb0.github.io/tft-mobile-overlay-data/data-index.json
  PUBLIC_BASE_URL: https://jinbbb0.github.io/tft-mobile-overlay-data

jobs:
  stage-candidate:
    runs-on: windows-latest
    timeout-minutes: 55
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
      candidate_version: ${{ steps.refresh.outputs.detected_version }}
      manifest_sha256: ${{ steps.candidate.outputs.manifest_sha256 }}
      quality_sha256: ${{ steps.candidate.outputs.quality_sha256 }}
      lkg_version: ${{ steps.candidate.outputs.lkg_version }}
    steps:
      - name: Check out data repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Prepare Canonical v2 production runtime
        shell: pwsh
        run: ./tools/prepare-production-runtime.ps1

      - name: Production contract regressions
        shell: pwsh
        run: |
          ./tools/test-current-set-universe.ps1
          ./tools/test-current-set-catalog-integration.ps1
          ./tools/test-rank-scope-policy.ps1
          ./tools/test-strict-production-source-policy.ps1
          ./tools/test-candidate-publication-lifecycle.ps1
          ./tools/test-id-compatibility-policy.ps1
          ./tools/test-patch-detection-policy.ps1
          ./tools/test-data-history-policy.ps1
          ./tools/test-new-set-readiness.ps1

      - name: Detect, generate, validate, and stage immutable candidate
        id: refresh
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "build/force-json-contract-repair.flag") {
            ./tools/refresh-live-data-gated.ps1 -Force
          } else {
            ./tools/refresh-live-data-gated.ps1
          }

      - name: Measure live emblem quality
        if: success() && steps.refresh.outputs.changed == 'true'
        shell: pwsh
        run: ./tools/measure-emblem-quality.ps1 -RequireReady

      - name: Write candidate-scoped data quality
        if: success() && steps.refresh.outputs.changed == 'true'
        shell: pwsh
        run: |
          $release = '${{ steps.refresh.outputs.detected_version }}'
          if (-not $release) { throw 'Refresh did not expose a candidate release id.' }
          $activeQuality = 'site/data-quality.json'
          if (-not (Test-Path -LiteralPath $activeQuality -PathType Leaf)) {
            throw 'Active LKG data-quality.json is missing; refusing candidate staging.'
          }
          $savedActiveQuality = 'build/active-data-quality.json'
          Copy-Item -LiteralPath $activeQuality -Destination $savedActiveQuality -Force
          ./tools/write-data-quality-status.ps1 -ReleaseId $release
          $candidateQuality = "site/bundles/$release/data-quality.json"
          Move-Item -LiteralPath $activeQuality -Destination $candidateQuality -Force
          Copy-Item -LiteralPath $savedActiveQuality -Destination $activeQuality -Force

      - name: Preserve active LKG public status
        if: success() && steps.refresh.outputs.changed == 'true'
        shell: pwsh
        run: ./tools/quality/Write-StagedPublicStatus.ps1 -SiteDirectory site

      - name: Validate immutable candidate locally
        id: candidate
        if: success() && steps.refresh.outputs.changed == 'true'
        shell: pwsh
        run: |
          $release = '${{ steps.refresh.outputs.detected_version }}'
          ./tools/quality/Test-StagedPublishCandidate.ps1 `
            -SiteDirectory site `
            -ReleaseId $release `
            -DataQualityPath "site/bundles/$release/data-quality.json"
          ./tools/validate-site.ps1 -SiteDirectory site

      - name: Commit staged candidate without moving latest
        if: success() && steps.refresh.outputs.changed == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/current site
          if (-not (git status --porcelain)) {
            throw 'Refresh reported a candidate change but produced no tracked diff.'
          }
          git commit -m "data: stage candidate ${{ steps.refresh.outputs.detected_version }}"
          $pushed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not $pushed) { throw 'Candidate push failed after 3 bounded attempts.' }

      - name: Configure Pages for staged candidate
        if: success() && steps.refresh.outputs.changed == 'true'
        uses: actions/configure-pages@v6

      - name: Upload staged Pages artifact
        if: success() && steps.refresh.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Preserve concise failure report
        if: failure() && hashFiles('build/failure-report/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: refresh-failure-${{ github.run_id }}
          path: build/failure-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Write staging summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## TFT Canonical v2 candidate staging

          - Result: ${{ steps.refresh.outputs.result }}
          - Candidate: ${{ steps.refresh.outputs.detected_version }}
          - Changed: ${{ steps.refresh.outputs.changed }}
          - LKG remains active: ${{ steps.candidate.outputs.lkg_version }}
          - Local manifest SHA-256: ${{ steps.candidate.outputs.manifest_sha256 }}
          - Local quality SHA-256: ${{ steps.candidate.outputs.quality_sha256 }}
          - No Android evidence is fabricated or bypassed here.
          - latestVersionId is not promoted by this workflow.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

  deploy-staged-candidate:
    if: needs.stage-candidate.result == 'success' && needs.stage-candidate.outputs.changed == 'true'
    needs: stage-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy candidate while LKG pointer remains unchanged
        id: deployment
        uses: actions/deploy-pages@v5

  verify-staged-candidate:
    if: needs.deploy-staged-candidate.result == 'success'
    needs: [stage-candidate, deploy-staged-candidate]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Verify remote immutable candidate and all payload hashes
        shell: pwsh
        run: |
          $release = '${{ needs.stage-candidate.outputs.candidate_version }}'
          $manifestUrl = "$env:PUBLIC_BASE_URL/bundles/$release/manifest.json"
          $qualityUrl = "$env:PUBLIC_BASE_URL/bundles/$release/data-quality.json"
          $verified = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              ./tools/quality/Test-RemoteStagedPublishCandidate.ps1 `
                -ManifestUrl $manifestUrl `
                -DataQualityUrl $qualityUrl `
                -ReleaseId $release `
                -ExpectedManifestSha256 '${{ needs.stage-candidate.outputs.manifest_sha256 }}' `
                -ExpectedDataQualitySha256 '${{ needs.stage-candidate.outputs.quality_sha256 }}'
              $verified = $true
              break
            } catch {
              if ($attempt -eq 6) { throw }
              Write-Warning "Remote candidate verification attempt $attempt failed while Pages propagates: $($_.Exception.Message)"
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          if (-not $verified) { throw 'Remote staged candidate verification did not converge.' }

      - name: Verify active public LKG remains coherent
        shell: pwsh
        run: |
          ./tools/validate-remote-site.ps1 -DataIndexUrl $env:DATA_INDEX_URL
          ./tools/check-public-data-quality.ps1 -DataIndexUrl $env:DATA_INDEX_URL
          $index = Invoke-RestMethod -Uri $env:DATA_INDEX_URL -Headers @{ 'Cache-Control'='no-cache' }
          if ([string]$index.latestVersionId -eq '${{ needs.stage-candidate.outputs.candidate_version }}') {
            throw 'Candidate was promoted before Android E2E.'
          }

      - name: Record staged gate result
        shell: pwsh
        run: |
          @"
          ## Staged candidate verified

          - Candidate: ${{ needs.stage-candidate.outputs.candidate_version }}
          - Remote manifest/payload SHA-256: PASS
          - Remote candidate quality SHA-256: PASS
          - Active LKG: ${{ needs.stage-candidate.outputs.lkg_version }}
          - Android E2E: REQUIRED BEFORE PROMOTION
          - Promotion: NOT PERFORMED
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
